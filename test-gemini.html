<!DOCTYPE html>
<html>
<head>
    <title>Gemini API テスト</title>
</head>
<body>
    <button onclick="testGemini()">Gemini API テスト</button>
    <div id="result"></div>

    <script>
        const API_KEY = "AIzaSyBbRfhTE7BRy2JlwNKv8CIdF7LNV_QyA-o";
        
        async function testGemini() {
            try {
                // シンプルなリクエスト形式で試す
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: "Hello"
                            }]
                        }]
                    })
                });
                
                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok) {
                    document.getElementById('result').innerHTML = '<pre>✅ API動作確認OK\n' + JSON.stringify(data, null, 2) + '</pre>';
                } else {
                    document.getElementById('result').innerHTML = '<pre>❌ エラー (Status: ' + response.status + ')\n' + JSON.stringify(data, null, 2) + '</pre>';
                }
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = '❌ エラー: ' + error.message;
            }
        }
    </script>
</body>
</html>
