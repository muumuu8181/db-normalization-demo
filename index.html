<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>データベース正規化ツール v1.0 (Gemini AI統合)</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }
        
        .main-layout {
            display: flex;
            height: 100vh;
        }
        
        .left-sidebar {
            width: 40%;
            background-color: white;
            border-right: 2px solid #ddd;
            overflow-y: auto;
            padding: 20px;
        }
        
        .right-content {
            width: 60%;
            display: flex;
            flex-direction: column;
        }
        
        .right-top {
            height: 50%;
            background-color: white;
            border-bottom: 2px solid #ddd;
            overflow-y: auto;
            padding: 20px;
        }
        
        .right-bottom {
            height: 50%;
            background-color: white;
            overflow-y: auto;
            padding: 20px;
        }
        
        .container {
            background-color: transparent;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fafafa;
        }
        
        .section h2 {
            color: #34495e;
            margin-top: 0;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            background-color: white;
        }
        
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        
        .checklist-table td {
            padding: 4px 8px;
        }
        
        th {
            background-color: #3498db;
            color: white;
            font-weight: bold;
        }
        
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        
        .checklist {
            margin: 20px 0;
        }
        
        .checklist label {
            display: block;
            margin: 10px 0;
            padding: 10px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .checklist label:hover {
            background-color: #e8f4fd;
        }
        
        .checklist input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2);
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .result.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .result.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .result.warning {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        
        .copy-button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
            transition: background-color 0.3s;
        }
        
        .copy-button:hover {
            background-color: #218838;
        }
        
        .copy-button.copied {
            background-color: #6f42c1;
        }
        
        .query-section {
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .query-header {
            background-color: #f8f9fa;
            padding: 10px 15px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .query-content {
            padding: 0;
        }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        .explanation {
            background-color: #e8f4fd;
            padding: 15px;
            border-left: 4px solid #3498db;
            margin: 10px 0;
        }
        
        .checklist-table tr.checked {
            background-color: #d5f4e6 !important;
            transition: background-color 0.3s ease;
        }
        
        .checklist-table tr.checked td {
            background-color: #d5f4e6 !important;
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <div class="left-sidebar">
            <h1 style="color: #2c3e50; margin-bottom: 30px; font-size: 24px;">DB正規化ツール v1.0</h1>
            <div class="section">
            <h2>データベース選択</h2>
            
            <div style="margin: 20px 0;">
                <label style="display: block; margin-bottom: 15px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; transition: background-color 0.3s;" onmouseover="this.style.backgroundColor='#f0f8ff'" onmouseout="this.style.backgroundColor='white'">
                    <input type="radio" name="database" value="retail" checked style="margin-right: 10px; transform: scale(1.2);" onchange="updateTableDropdownFromRadio()">
                    <strong>小売業データベース</strong>
                    <div style="margin-top: 5px; color: #666; font-size: 14px;">
                        顧客、商品、カテゴリ、注文、注文明細テーブル（EC・店舗データ）
                    </div>
                </label>
                
                <label style="display: block; margin-bottom: 15px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; transition: background-color 0.3s;" onmouseover="this.style.backgroundColor='#f0f8ff'" onmouseout="this.style.backgroundColor='white'">
                    <input type="radio" name="database" value="finance" style="margin-right: 10px; transform: scale(1.2);" onchange="updateTableDropdownFromRadio()">
                    <strong>金融業データベース</strong>
                    <div style="margin-top: 5px; color: #666; font-size: 14px;">
                        顧客、口座、取引、ローン、支店テーブル（銀行・金融データ）
                    </div>
                </label>
                
                <label style="display: block; margin-bottom: 15px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; transition: background-color 0.3s;" onmouseover="this.style.backgroundColor='#f0f8ff'" onmouseout="this.style.backgroundColor='white'">
                    <input type="radio" name="database" value="realestate" style="margin-right: 10px; transform: scale(1.2);" onchange="updateTableDropdownFromRadio()">
                    <strong>不動産業データベース</strong>
                    <div style="margin-top: 5px; color: #666; font-size: 14px;">
                        物件、営業担当、顧客、内見、契約テーブル（不動産取引データ）
                    </div>
                </label>
            </div>
            
            <button id="loadDbButton" onclick="loadDatabase()" style="background-color: #e74c3c; padding: 12px 24px;">データベースを読み込み</button>
            </div>
            
            <div class="section" style="margin-top: 20px;">
                <h2>テーブル選択</h2>
                <select id="tableName" style="padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; width: 100%; font-size: 14px; max-width: 400px;" onchange="showSelectedTable()">
                    <option value="">データベース選択</option>
                </select>
            </div>
            
            <div class="section" style="margin-top: 20px;">
                <h2>データクリーニング・正規化チェックリスト</h2>
                
                <table class="checklist-table" style="width: 100%; margin: 15px 0;">
                    <thead>
                        <tr>
                            <th style="width: 50px; text-align: center;">選択</th>
                            <th>処理内容</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td style="text-align: center;"><input type="checkbox" id="check1" value="duplicate_data" onchange="toggleRowColor(this)"></td>
                            <td><label for="check1" style="cursor: pointer; display: block; padding: 4px 8px;">重複データの検出・削除</label></td>
                        </tr>
                        <tr>
                            <td style="text-align: center;"><input type="checkbox" id="check2" value="whitespace_cleanup" onchange="toggleRowColor(this)"></td>
                            <td><label for="check2" style="cursor: pointer; display: block; padding: 4px 8px;">空白文字の統一</label></td>
                        </tr>
                        <tr>
                            <td style="text-align: center;"><input type="checkbox" id="check3" value="case_normalization" onchange="toggleRowColor(this)"></td>
                            <td><label for="check3" style="cursor: pointer; display: block; padding: 4px 8px;">大文字・小文字の統一</label></td>
                        </tr>
                        <tr>
                            <td style="text-align: center;"><input type="checkbox" id="check4" value="null_empty_check" onchange="toggleRowColor(this)"></td>
                            <td><label for="check4" style="cursor: pointer; display: block; padding: 4px 8px;">NULL値・空文字列の検出</label></td>
                        </tr>
                        <tr>
                            <td style="text-align: center;"><input type="checkbox" id="check5" value="date_format_standardization" onchange="toggleRowColor(this)"></td>
                            <td><label for="check5" style="cursor: pointer; display: block; padding: 4px 8px;">日付形式の統一</label></td>
                        </tr>
                        <tr>
                            <td style="text-align: center;"><input type="checkbox" id="check6" value="phone_format_standardization" onchange="toggleRowColor(this)"></td>
                            <td><label for="check6" style="cursor: pointer; display: block; padding: 4px 8px;">電話番号形式の統一</label></td>
                        </tr>
                        <tr>
                            <td style="text-align: center;"><input type="checkbox" id="check7" value="category_standardization" onchange="toggleRowColor(this)"></td>
                            <td><label for="check7" style="cursor: pointer; display: block; padding: 4px 8px;">カテゴリ表記ゆれの統一</label></td>
                        </tr>
                        <tr>
                            <td style="text-align: center;"><input type="checkbox" id="check8" value="data_type_validation" onchange="toggleRowColor(this)"></td>
                            <td><label for="check8" style="cursor: pointer; display: block; padding: 4px 8px;">データ型の検証</label></td>
                        </tr>
                        <tr>
                            <td style="text-align: center;"><input type="checkbox" id="check9" value="length_validation" onchange="toggleRowColor(this)"></td>
                            <td><label for="check9" style="cursor: pointer; display: block; padding: 4px 8px;">文字数制限のチェック</label></td>
                        </tr>
                        <tr>
                            <td style="text-align: center;"><input type="checkbox" id="check10" value="special_char_check" onchange="toggleRowColor(this)"></td>
                            <td><label for="check10" style="cursor: pointer; display: block; padding: 4px 8px;">特殊文字・異常文字の検出</label></td>
                        </tr>
                    </tbody>
                </table>

                    <div>

                            SQLite
                        </label>

                        <input type="checkbox" id="includeRelationships" checked>
                        リレーションシップを明記
                    </label>
                    <label style="display: block; margin-bottom: 10px;">
                        <input type="checkbox" id="includeCardinality" checked>
                        カーディナリティ（1:1, 1:n）を表示
                    </label>
                    <label style="display: block; margin-bottom: 10px;">
                        <input type="checkbox" id="includeConstraints">
                        制約条件を含める
                    </label>
                </div>
                
                <button id="generateErButton" onclick="generateErDiagram()" 
                        style="background-color: #e67e22; margin-right: 10px;">
                    ER図を生成 (Gemini AI)
                </button>
                <button onclick="clearApiKey()"

                    APIキーリセット
                </button>
                
                <div id="apiStatus" style="margin-top: 10px; padding: 10px; border-radius: 5px; 
                                           background-color: #d1ecf1; border: 1px solid #bee5eb; display: none;">
                </div>
            </div>
        </div>
        
        <div class="right-content">
            <div class="right-top">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h2 style="color: #2c3e50; margin: 0;">生成されたコンテンツ</h2>
                    <div>

                        <button onclick="showErTab()" id="erTabBtn" style="background-color: #95a5a6; font-size: 12px; padding: 5px 10px;">

                    </div>
                </div>

                    </div>

                    </div>
                </div>
                
                <!-- ER図タブ -->

                </div>
            </div>

                    テーブルを選択してください。
                </div>
                
            </div>
        </div>
    </div>

        function loadDatabase() {
            const button = document.getElementById('loadDbButton');
            const originalText = button.textContent;
            
            // ローディング状態を開始
            button.textContent = '読み込み中...';
            button.disabled = true;
            button.style.backgroundColor = '#95a5a6';
            button.style.cursor = 'not-allowed';
            
            try {
                const selectedDBElement = document.querySelector('input[name="database"]:checked');
                if (!selectedDBElement) {
                    alert('データベースを選択してください');
                    resetButton();
                    return;
                }
                
                const selectedDB = selectedDBElement.value;
                console.log('選択されたDB:', selectedDB);
                
                if (!databases[selectedDB]) {
                    alert('選択されたデータベースが見つかりません: ' + selectedDB);
                    resetButton();
                    return;
                }
                
                // 少し遅延させてローディング効果を見せる
                setTimeout(() => {
                    try {
                        // テーブル名のドロップダウンを更新
                        updateTableDropdown(selectedDB);
                        console.log('データベース読み込み完了:', selectedDB);
                        
                        // 成功状態を表示（そのまま維持）
                        button.textContent = '読み込み完了 ✓';
                        button.style.backgroundColor = '#27ae60';
                        button.style.cursor = 'pointer';
                        button.disabled = false;
                    } catch (error) {
                        console.error('データベース更新エラー:', error);
                        alert('データベースの更新中にエラーが発生しました: ' + error.message);
                        resetButton();
                    }
                }, 500);
                
            } catch (error) {
                console.error('loadDatabase関数でエラー:', error);
                alert('データベースの読み込み中にエラーが発生しました: ' + error.message);
                resetButton();
            }
            
            function resetButton() {
                button.textContent = originalText;
                button.disabled = false;
                button.style.backgroundColor = '#e74c3c';
                button.style.cursor = 'pointer';
            }
        }

        function updateTableDropdown(selectedDB) {
            try {
                const tableSelect = document.getElementById('tableName');
                if (!tableSelect) {
                    console.error('テーブル選択要素が見つかりません');
                    return;
                }
                
                const database = databases[selectedDB];
                if (!database || !database.tables) {
                    console.error('データベースまたはテーブルが見つかりません:', selectedDB);
                    return;
                }
                
                // ドロップダウンをクリア
                tableSelect.innerHTML = '';
                
                // デフォルトオプション
                const defaultOption = document.createElement('option');
                defaultOption.value = '';
                defaultOption.textContent = 'テーブルを選択してください';
                tableSelect.appendChild(defaultOption);
                
                // 選択されたデータベースのテーブル一覧を追加
                Object.keys(database.tables).forEach(tableKey => {
                    const table = database.tables[tableKey];
                    const option = document.createElement('option');
                    option.value = tableKey;
                    option.textContent = `${tableKey} (${table.name}) - ${table.data && table.data.length ? table.data.length : 0}件`;
                    tableSelect.appendChild(option);
                });
                
                console.log('テーブルドロップダウン更新完了:', Object.keys(database.tables).length + '件');
            } catch (error) {
                console.error('updateTableDropdown関数でエラー:', error);
            }
        }

        // データベース選択が変更された時にテーブル一覧を更新
        function updateTableDropdownFromRadio() {
            const selectedDB = document.querySelector('input[name="database"]:checked');
            if (selectedDB) {
                updateTableDropdown(selectedDB.value);
            }
            // テーブル表示もクリア
            clearSelectedTable();
        }

        // 選択したテーブルを表示
        function showSelectedTable() {
            const selectedDB = document.querySelector('input[name="database"]:checked').value;
            const selectedTable = document.getElementById('tableName').value;
            
            if (!selectedTable) {
                clearSelectedTable();
                return;
            }
            
            const database = databases[selectedDB];
            const table = database.tables[selectedTable];
            
            const selectedTableContainer = document.getElementById('selectedTableContainer');
            
            let tableHTML = `
                <div style="margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; overflow: hidden;">
                    <div style="background-color: #f8f9fa; padding: 15px; border-bottom: 1px solid #ddd;">
                        <h4 style="margin: 0; color: #2c3e50;">${table.name} (${table.data.length}件)</h4>
                    </div>
                    <div style="overflow-x: auto; max-height: 400px; overflow-y: auto;">
                        <table style="margin: 0; border: none; width: 100%;">
                            <thead style="position: sticky; top: 0; background-color: #3498db;">
                                <tr>
                                    ${table.columns.map(col => `<th style="color: white; padding: 4px 8px; text-align: left; white-space: nowrap;">${col}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody>
                                ${table.data.slice(0, 20).map(row => `
                                    <tr>
                                        ${row.map(cell => `<td style="padding: 6px; border-bottom: 1px solid #eee; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis;">${cell}</td>`).join('')}
                                    </tr>
                                `).join('')}
                                ${table.data.length > 20 ? `
                                    <tr>
                                        <td colspan="${table.columns.length}" style="padding: 10px; text-align: center; color: #666; font-style: italic;">
                                            ... さらに${table.data.length - 20}件のデータがあります
                                        </td>
                                    </tr>
                                ` : ''}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            
            selectedTableContainer.innerHTML = tableHTML;
            document.getElementById('selectedTableSection').style.display = 'block';
            document.getElementById('noTableMessage').style.display = 'none';
        }

        // 選択テーブル表示をクリア
        function clearSelectedTable() {
            document.getElementById('selectedTableSection').style.display = 'none';
            document.getElementById('noTableMessage').style.display = 'block';
        }

        function executeQuery(query, title, type) {
            const button = event.target;
            const originalText = button.textContent;
            
            // 実行中の表示
            button.textContent = '実行中...';
            button.disabled = true;
            button.style.backgroundColor = '#95a5a6';
            
            // 現在選択されているテーブルのデータを取得
            const selectedDB = document.querySelector('input[name="database"]:checked')?.value;
            const tableName = document.getElementById('tableName').value;
            
            if (!selectedDB || !tableName) {
                alert('データベースとテーブルを選択してください');
                resetExecuteButton();
                return;
            }
            
            // シミュレーション実行
            setTimeout(() => {
                try {
                    const tableData = databases[selectedDB].tables[tableName];
                    if (!tableData) {
                        throw new Error('テーブルデータが見つかりません');
                    }
                    
                    let resultData;
                    let resultMessage;
                    
                    if (type === 'detection') {
                        resultData = simulateDetectionQuery(tableData, query, title);
                        resultMessage = `🔍 ${title} - 問題検出結果`;
                    } else {
                        resultData = simulateCleanupQuery(tableData, query, title);
                        resultMessage = `🔧 ${title} - クリーンアップ結果`;
                    }
                    
                    displayQueryResult(resultData, resultMessage);
                    
                    button.textContent = '実行完了 ✓';
                    button.style.backgroundColor = '#27ae60';
                    button.disabled = false;
                    
                } catch (error) {
                    console.error('クエリ実行エラー:', error);
                    alert('クエリの実行中にエラーが発生しました: ' + error.message);
                    resetExecuteButton();
                }
            }, 1000);
            
            function resetExecuteButton() {
                button.textContent = originalText;
                button.disabled = false;
                button.style.backgroundColor = type === 'detection' ? '#3498db' : '#e67e22';
            }
        }
        
        function simulateDetectionQuery(tableData, query, title) {
            const columns = tableData.columns;
            const data = tableData.data;
            let problemRows = [];
            
            if (title.includes('重複')) {
                const seen = new Set();
                data.forEach((row, index) => {
                    const key = row.join('|');
                    if (seen.has(key)) {
                        problemRows.push(row);
                    }
                    seen.add(key);
                });
            } else if (title.includes('空白')) {
                data.forEach(row => {
                    if (row.some(cell => typeof cell === 'string' && (cell.trim() !== cell || cell.includes('　')))) {
                        problemRows.push(row);
                    }
                });
            } else if (title.includes('NULL')) {
                data.forEach(row => {
                    if (row.some(cell => cell === null || cell === '' || cell === undefined)) {
                        problemRows.push(row);
                    }
                });
            } else {
                problemRows = data.slice(0, Math.min(3, data.length));
            }
            
            return { columns: columns, data: problemRows, count: problemRows.length };
        }
        
        function simulateCleanupQuery(tableData, query, title) {
            const columns = tableData.columns;
            let cleanedData = [...tableData.data];
            
            if (title.includes('空白')) {
                cleanedData = cleanedData.map(row => 
                    row.map(cell => typeof cell === 'string' ? cell.trim().replace(/　/g, ' ') : cell)
                );
            } else if (title.includes('大文字')) {
                cleanedData = cleanedData.map(row => 
                    row.map(cell => typeof cell === 'string' ? cell.toLowerCase() : cell)
                );
            }
            
            return { columns: columns, data: cleanedData.slice(0, 10), count: cleanedData.length };
        }
        
        function toggleRowColor(checkbox) {
            const row = checkbox.closest('tr');
            if (checkbox.checked) {
                row.classList.add('checked');
            } else {
                row.classList.remove('checked');
            }
        }
        
        function truncateQuery(query) {
            const lines = query.split('\n');
            const displayLines = lines.slice(0, 2);
            return displayLines.join('\n') + (lines.length > 2 ? '\n...' : '');
        }

        // ER図生成機能
        async function generateErDiagram() {
            const button = document.getElementById('generateErButton');
            const originalText = button.textContent;
            const apiStatus = document.getElementById('apiStatus');
            
            // APIキーチェック
            if (!GEMINI_API_KEY) {
                const inputKey = prompt('Gemini APIキーを入力してください\\n\\n取得方法:\\n1. https://aistudio.google.com/app/apikey にアクセス\\n2. \"Create API Key\"をクリック\\n3. 生成されたキーをコピー\\n\\nAPIキー:');
                if (!inputKey) {
                    alert('APIキーが必要です');
                    return;
                }
                GEMINI_API_KEY = inputKey.trim();
                localStorage.setItem('gemini_api_key_v2', GEMINI_API_KEY);
                
                // API状態更新
                apiStatus.style.display = 'block';
                apiStatus.innerHTML = '🔑 APIキーが設定されました。再度ER図生成を実行してください。';
                apiStatus.style.backgroundColor = '#d1ecf1';
                return;
            }
            
            // 選択されたデータベースを確認
            const selectedDBElement = document.querySelector('input[name="database"]:checked');
            if (!selectedDBElement) {
                alert('データベースを選択してください');
                return;
            }
            
            const selectedDB = selectedDBElement.value;
            const database = databases[selectedDB];
            
            if (!database) {
                alert('データベースが見つかりません');
                return;
            }
            
            // ローディング状態
            button.textContent = 'AI生成中...';
            button.disabled = true;
            button.style.backgroundColor = '#95a5a6';
            
            apiStatus.style.display = 'block';
            apiStatus.innerHTML = '🤖 Gemini AIでER図を生成しています...';
            apiStatus.style.backgroundColor = '#fff3e0';
            apiStatus.style.borderColor = '#ff9800';
            
            try {
                // データベース構造をテキストで準備
                const dbStructure = prepareDbStructureForAI(database);
                
                // オプション取得
                const includeRelationships = document.getElementById('includeRelationships').checked;
                const includeCardinality = document.getElementById('includeCardinality').checked;
                const includeConstraints = document.getElementById('includeConstraints').checked;
                
                // Gemini API用のプロンプトを準備
                const prompt = createErDiagramPrompt(dbStructure, {
                    includeRelationships,
                    includeCardinality,
                    includeConstraints
                });
                
                console.log('Gemini APIでER図生成要求を送信...');
                
                // Gemini API呼び出し
                const erDiagramResult = await callGeminiAPI(prompt);
                
                // 成功状態
                button.textContent = 'ER図生成完了 ✓';
                button.style.backgroundColor = '#27ae60';
                button.disabled = false;
                
                apiStatus.innerHTML = '✅ ER図生成完了！Gemini AIが高品質なER図を作成しました。';
                apiStatus.style.backgroundColor = '#d4edda';
                apiStatus.style.borderColor = '#c3e6cb';
                
                // 結果を表示（右上パネルのER図タブに表示）
                displayErDiagram(erDiagramResult);
                
                // ER図タブに自動切り替え
                showErTab();
                
                // 2秒後に元に戻す
                setTimeout(() => {
                    button.textContent = originalText;
                    button.style.backgroundColor = '#e67e22';
                }, 2000);
                
            } catch (error) {
                console.error('ER図生成エラー:', error);
                
                // APIキーエラーの場合は削除
                if (error.message.includes('API key not valid') || error.message.includes('401') || error.message.includes('403')) {
                    localStorage.removeItem('gemini_api_key_v2');
                    GEMINI_API_KEY = null;
                    apiStatus.innerHTML = '❌ APIキーが無効です。再度設定してください。';
                } else {
                    apiStatus.innerHTML = `❌ エラー: ${error.message}`;
                }
                
                apiStatus.style.backgroundColor = '#f8d7da';
                apiStatus.style.borderColor = '#f5c6cb';
                
                alert('ER図の生成中にエラーが発生しました: ' + error.message);
                resetButton();

            function resetButton() {
                button.textContent = originalText;
                button.disabled = false;
                button.style.backgroundColor = '#e67e22';
            }
        }
        
        // Gemini API呼び出し
        async function callGeminiAPI(prompt) {
            try {
                console.log('Gemini API呼び出し開始...');
                console.log('プロンプト長:', prompt.length);
                console.log('APIキー:', GEMINI_API_KEY.substring(0, 20) + '...');
                
                const requestBody = {
                    contents: [{
                        parts: [{
                            text: prompt
                        }]
                    }],
                    generationConfig: {
                        temperature: 0.7,
                        topK: 40,
                        topP: 0.95,
                        maxOutputTokens: 2048,
                    },
                    safetySettings: [
                        {
                            category: "HARM_CATEGORY_HARASSMENT",
                            threshold: "BLOCK_MEDIUM_AND_ABOVE"
                        },
                        {
                            category: "HARM_CATEGORY_HATE_SPEECH",
                            threshold: "BLOCK_MEDIUM_AND_ABOVE"
                        },
                        {
                            category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", 
                            threshold: "BLOCK_MEDIUM_AND_ABOVE"
                        },
                        {
                            category: "HARM_CATEGORY_DANGEROUS_CONTENT",
                            threshold: "BLOCK_MEDIUM_AND_ABOVE"
                        }
                    ]
                };
                
                console.log('リクエストボディ:', JSON.stringify(requestBody, null, 2));
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });
                
                console.log('レスポンス状態:', response.status, response.statusText);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('APIエラー詳細:', errorText);
                    throw new Error(`API呼び出し失敗: ${response.status} ${response.statusText}\n詳細: ${errorText}`);
                }
                
                const data = await response.json();
                console.log('レスポンスデータ:', data);
                
                if (!data.candidates || !data.candidates[0]) {
                    console.error('候補が見つかりません:', data);
                    throw new Error('APIから候補が返されませんでした');
                }
                
                if (!data.candidates[0].content) {
                    console.error('コンテンツが見つかりません:', data.candidates[0]);
                    throw new Error('APIからコンテンツが返されませんでした');
                }
                
                const result = data.candidates[0].content.parts[0].text;
                console.log('AI生成結果 (最初の200文字):', result.substring(0, 200));
                
                return result;
                
            } catch (error) {
                console.error('Gemini API エラー:', error);
                throw error;
            }
        }
        
        // ER図用プロンプト生成
        function createErDiagramPrompt(dbStructure, options) {
            let prompt = `以下のデータベース構造からER図をMermaid記法で生成してください：

${dbStructure}

要求事項：
1. 日本語のテーブル名・カラム名に対応
2. 見やすいレイアウトで配置
3. 主キー（PK）と外部キー（FK）を明記`;

            if (options.includeRelationships) {
                prompt += "\n4. テーブル間のリレーションシップを明確に表現";
            }
            
            if (options.includeCardinality) {
                prompt += "\n5. カーディナリティ（1:1, 1:n, n:m）を正確に設定";
            }
            
            if (options.includeConstraints) {
                prompt += "\n6. 制約条件（UNIQUE、NOT NULL等）を含める";
            }
            
            prompt += `

出力形式：
- Mermaid ERDiagram記法で出力
- コードブロック（\`\`\`mermaid）で囲む
- 日本語コメントを適切に追加
- 実際のデータベース設計に使える高品質なER図を作成

Mermaid ERDiagram記法で出力してください。`;
            
            return prompt;
        }
        
        // データベース構造をAI用に整形
        function prepareDbStructureForAI(database) {
            const structure = {
                name: database.name,
                description: database.description,
                tables: {}
            };
            
            Object.keys(database.tables).forEach(tableName => {
                const table = database.tables[tableName];
                structure.tables[tableName] = {
                    name: table.name,
                    columns: table.columns,
                    sampleData: table.data.slice(0, 3) // 最初の3行のみ
                };
            });
            
            return JSON.stringify(structure, null, 2);
        }
        
        // ER図表示関数
        function displayErDiagram(erDiagramCode) {

            // Mermaidコードを抽出
            const mermaidMatch = erDiagramCode.match(/```mermaid\n([\s\S]*?)\n```/);
            const mermaidCode = mermaidMatch ? mermaidMatch[1] : erDiagramCode;
            
            generatedErDiagram.innerHTML = `

                    <pre style="background-color: white; padding: 15px; border-radius: 3px; overflow-x: auto;

                    <div style="margin-top: 15px; padding: 10px; background-color: #e3f2fd; border-radius: 3px; 
                               border-left: 4px solid #2196f3;">
                        <p style="margin: 0; color: #1565c0; font-size: 14px;">

            erOutput.style.display = 'block';
            noErMessage.style.display = 'none';

        // ER図コピー関数
        function copyErDiagram(erCode, button) {
