<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loadDatabase関数テスト</title>
</head>
<body>
    <h1>loadDatabase関数の動作テスト</h1>
    
    <!-- データベース選択 -->
    <div>
        <h2>データベース選択</h2>
        <label>
            <input type="radio" name="database" value="retail" checked>
            小売業データベース
        </label>
        <label>
            <input type="radio" name="database" value="finance">
            金融業データベース
        </label>
        <label>
            <input type="radio" name="database" value="realestate">
            不動産業データベース
        </label>
    </div>
    
    <!-- loadDatabaseボタン -->
    <button onclick="loadDatabase()" style="background-color: #e74c3c; padding: 12px 24px; margin: 20px 0;">データベースを読み込み</button>
    
    <!-- テーブル選択 -->
    <div>
        <h2>テーブル選択</h2>
        <select id="tableName" style="padding: 8px; border: 1px solid #ddd; border-radius: 4px; width: 100%; font-size: 14px; max-width: 400px;">
            <option value="">テーブルを選択してください</option>
        </select>
    </div>
    
    <!-- テスト用の簡単なデータベース -->
    <script>
        const databases = {
            retail: {
                name: "小売業データベース",
                tables: {
                    customers: {
                        name: "customers (顧客)",
                        data: [
                            ["1", "田中太郎", "tanaka@email.com"],
                            ["2", "佐藤花子", "sato@email.com"]
                        ]
                    },
                    products: {
                        name: "products (商品)",
                        data: [
                            ["101", "ノートPC", "98000"],
                            ["102", "マウス", "2000"]
                        ]
                    }
                }
            },
            finance: {
                name: "金融業データベース",
                tables: {
                    accounts: {
                        name: "accounts (口座)",
                        data: [
                            ["A001", "普通預金", "100000"],
                            ["A002", "定期預金", "500000"]
                        ]
                    }
                }
            },
            realestate: {
                name: "不動産業データベース",
                tables: {
                    properties: {
                        name: "properties (物件)",
                        data: [
                            ["P001", "マンション", "3000000"],
                            ["P002", "一戸建て", "4500000"]
                        ]
                    }
                }
            }
        };

        // loadDatabase関数
        function loadDatabase() {
            console.log("loadDatabase関数が呼び出されました");
            const selectedDB = document.querySelector('input[name="database"]:checked').value;
            console.log("選択されたデータベース:", selectedDB);
            
            // テーブル名のドロップダウンを更新
            updateTableDropdown(selectedDB);
        }

        function updateTableDropdown(selectedDB) {
            console.log("updateTableDropdown関数が呼び出されました。データベース:", selectedDB);
            const tableSelect = document.getElementById('tableName');
            const database = databases[selectedDB];
            
            if (!database) {
                console.error("データベースが見つかりません:", selectedDB);
                return;
            }
            
            console.log("データベース情報:", database);
            
            // ドロップダウンをクリア
            tableSelect.innerHTML = '';
            
            // デフォルトオプション
            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = 'テーブルを選択してください';
            tableSelect.appendChild(defaultOption);
            
            // 選択されたデータベースのテーブル一覧を追加
            Object.keys(database.tables).forEach(tableKey => {
                const table = database.tables[tableKey];
                const option = document.createElement('option');
                option.value = tableKey;
                option.textContent = `${tableKey} (${table.name}) - ${table.data.length}件`;
                tableSelect.appendChild(option);
                console.log("テーブルオプションを追加:", tableKey, table.name);
            });
            
            console.log("テーブルドロップダウンの更新完了");
        }
    </script>
</body>
</html>
