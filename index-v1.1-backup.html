        // Firebase認証初期化
        function initializeFirebaseAuth() {
            auth.onAuthStateChanged(user => {
                currentUser = user;
                updateUserUI();
                if (user) {
                    console.log('Firebase認証成功:', user.email);
                    authMode = 'firebase_oauth';
                    updateAuthStatus('firebase_oauth', `Firebase認証成功！ ${user.email} でログイン中`);
                    
                    // ER図生成ボタンを有効化
                    const erButton = document.getElementById('generateErButton');
                    if (erButton) {
                        erButton.disabled = false;
                        erButton.style.backgroundColor = '#e67e22';
                        erButton.textContent = 'ER図を生成（Firebase認証済み）';
                    }
                    
                    // サインアウトボタンを表示
                    const signOutBtn = document.getElementById('signOutBtn');
                    if (signOutBtn) {
                        signOutBtn.style.display = 'inline-block';
                    }
                } else {
                    console.log('Firebase認証なし');
                    authMode = 'demo';
                    
                    // サインアウトボタンを非表示
                    const signOutBtn = document.getElementById('signOutBtn');
                    if (signOutBtn) {
                        signOutBtn.style.display = 'none';
                    }
                    
                    updateUserUI();
                }
            });
        }
        
        // Firebase Googleサインイン（本物）
        async function signInWithGoogle() {
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                
                // Gemini API用のスコープを追加
                provider.addScope('https://www.googleapis.com/auth/generative-language.retriever');
                provider.addScope('https://www.googleapis.com/auth/cloud-platform');
                
                // 常にアカウント選択画面を表示
                provider.setCustomParameters({
                    prompt: 'select_account'
                });
                
                updateAuthStatus('loading', 'Googleアカウント + Gemini APIスコープでサインイン中...');
                
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                const credential = result.credential;
                
                console.log('Firebase Google認証成功（Geminiスコープ付き）', {
                    email: user.email,
                    displayName: user.displayName,
                    photoURL: user.photoURL,
                    uid: user.uid,
                    accessToken: credential.accessToken ? '取得済み' : 'なし',
                    scopes: 'generative-language.retriever, cloud-platform'
                });
                
                // アクセストークンをグローバル変数に保存
                if (credential.accessToken) {
                    window.geminiAccessToken = credential.accessToken;
                    console.log('Gemini用アクセストークン保存完了');
                }
                
                updateAuthStatus('firebase_oauth', `認証成功！ ${user.email} でログイン中（Gemini API利用可能）`);
                
            } catch (error) {
                console.error('Firebase認証エラー:', error);
                updateAuthStatus('error', `認証エラー: ${error.message}`);
            }
        }
        
        // サインアウト
        function signOut() {
            auth.signOut().then(() => {
                console.log('Firebase サインアウト成功');
                updateAuthStatus('demo', 'サインアウトしました。デモモードに切り替えます。');
                
                // ER図生成ボタンを無効化

                    erButton.disabled = true;
                    erButton.style.backgroundColor = '#95a5a6';
                    erButton.textContent = 'ER図を生成（認証が必要）';
                }
            }).catch((error) => {
                console.error('サインアウトエラー:', error);
                updateAuthStatus('error', 'サインアウトに失敗しました');
            });
        }
        
        // ユーザーUI更新

            // 実装は後で追加（現在は基本機能のみ）
        }
        
        // APIキー認証
        function useApiKey() {
            const apiKey = prompt('Gemini APIキーを入力してください\n(https://aistudio.google.com/app/apikey で取得):');
            if (apiKey) {
                localStorage.setItem('gemini_api_key', apiKey);
                authMode = 'apikey';
                updateAuthStatus('apikey', 'APIキー認証設定完了。ER図生成が利用可能になりました。');
                
                // ER図生成ボタンを有効化
                const erButton = document.getElementById('generateErButton');
                if (erButton) {
                    erButton.disabled = false;
                    erButton.style.backgroundColor = '#e67e22';
                }
            }
        }

        // 認証状態更新
        function updateAuthStatus(mode, message) {
            const authStatus = document.getElementById('authStatus');
            authStatus.style.display = 'block';
            
            switch(mode) {
                case 'firebase_oauth':
                    authStatus.style.backgroundColor = '#e8f5e8';
                    authStatus.style.borderColor = '#4caf50';
                    authStatus.innerHTML = '🔥 ' + message;
                    break;
                case 'loading':
                    authStatus.style.backgroundColor = '#fff3e0';
                    authStatus.style.borderColor = '#ff9800';
                    authStatus.innerHTML = '⏳ ' + message;
                    break;
                case 'apikey':
                    authStatus.style.backgroundColor = '#fff3e0';
                    authStatus.style.borderColor = '#ff9800';
                    authStatus.innerHTML = '🔧 ' + message;
                    break;
                case 'demo':
                    authStatus.style.backgroundColor = '#f3e5f5';
                    authStatus.style.borderColor = '#9c27b0';
                    authStatus.innerHTML = '🎯 ' + message;
                    break;
                case 'authenticated_demo':
                    authStatus.style.backgroundColor = '#e1bee7';
                    authStatus.style.borderColor = '#9c27b0';
                    authStatus.innerHTML = '🤖 ' + message;
                    break;
                case 'error':
                    authStatus.style.backgroundColor = '#ffebee';
                    authStatus.style.borderColor = '#f44336';
                    authStatus.innerHTML = '❌ ' + message;
                    break;
            }
            authStatus.style.border = '1px solid';

        function loadDatabase() {
            const button = document.getElementById('loadDbButton');
            const originalText = button.textContent;
            
            // ローディング状態を開始
            button.textContent = '読み込み中...';
            button.disabled = true;
            button.style.backgroundColor = '#95a5a6';
            button.style.cursor = 'not-allowed';
            
            try {
                const selectedDBElement = document.querySelector('input[name="database"]:checked');
                if (!selectedDBElement) {
                    alert('データベースを選択してください');
                    resetButton();
                    return;
                }
                
                const selectedDB = selectedDBElement.value;
                console.log('選択されたDB:', selectedDB);
                
                if (!databases[selectedDB]) {
                    alert('選択されたデータベースが見つかりません: ' + selectedDB);
                    resetButton();
                    return;
                }
                
                // 少し遅延させてローディング効果を見せる
                setTimeout(() => {
                    try {
                        // テーブル名のドロップダウンを更新
                        updateTableDropdown(selectedDB);
                        console.log('データベース読み込み完了:', selectedDB);
                        
                        // 成功状態を表示（そのまま維持）
                        button.textContent = '読み込み完了 ✓';
                        button.style.backgroundColor = '#27ae60';
                        button.style.cursor = 'pointer';
                        button.disabled = false;
                    } catch (error) {
                        console.error('データベース更新エラー:', error);
                        alert('データベースの更新中にエラーが発生しました: ' + error.message);
                        resetButton();
                    }
                }, 500);
                
            } catch (error) {
                console.error('loadDatabase関数でエラー:', error);
                alert('データベースの読み込み中にエラーが発生しました: ' + error.message);
                resetButton();
            }
            
            function resetButton() {
                button.textContent = originalText;
                button.disabled = false;
                button.style.backgroundColor = '#3498db';
                button.style.cursor = 'pointer';
            }
        }

        function updateTableDropdown(selectedDB) {
            try {
                const tableSelect = document.getElementById('tableName');
                if (!tableSelect) {
                    console.error('テーブル選択要素が見つかりません');
                    return;
                }
                
                const database = databases[selectedDB];

                    console.error('データベースが見つかりません:', selectedDB);

                    console.log('デモモード: 認証なしでサンプルER図を生成');
                    await new Promise(resolve => setTimeout(resolve, 1000)); // 処理時間をシミュレート
                    return generateSampleErDiagram();
                    
                } else if (authMode === 'authenticated_demo') {
                    // 認証済みデモモード - 実際のGemini CLI呼び出し
                    console.log('認証済みデモ: 実際のGemini CLI呼び出し');
                    return await callGeminiCLI(prompt);
                    
                } else if (authMode === 'firebase_oauth') {
                    // Firebase OAuth認証モード - Google認証トークンを使用
                    console.log('Firebase OAuth認証済み - Google認証トークンでGemini API呼び出し');
                    
                    if (!currentUser) {
                        throw new Error('認証されていません');
                    }
                    
                    // Google OAuth アクセストークンを取得
                    const accessToken = window.geminiAccessToken;
                    if (!accessToken) {
                        throw new Error('Gemini APIアクセストークンが見つかりません。再度サインインしてください。');
                    }
                    
                    console.log('Gemini用アクセストークン取得成功');
                    
                    // Google OAuth アクセストークンを使ってGemini APIを呼び出し
                    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${accessToken}`
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: prompt
                                }]
                            }]
                        })
                    });
                    
                    console.log('Gemini API レスポンス:', response.status, response.statusText);
                    
                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error('Gemini API エラー詳細:', errorText);
                        throw new Error(`Gemini API呼び出し失敗: ${response.status} ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    console.log('Gemini API レスポンス データ:', data);
                    
                    if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                        console.error('無効なAPIレスポンス:', data);
                        throw new Error('APIレスポンスが無効です');
                    }
                    
                    return data.candidates[0].content.parts[0].text;
                    
                } else if (authMode === 'apikey') {
                    // APIキー認証モード
                    let apiKey = localStorage.getItem('gemini_api_key');
                    
                    if (!apiKey) {
                        throw new Error('APIキーが設定されていません');
                    }
                    
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: prompt
                                }]
                            }]
                        })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`API呼び出し失敗: ${response.status} ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    
                    if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                        throw new Error('APIレスポンスが無効です');
                    }
                    
                    return data.candidates[0].content.parts[0].text;
                } else {
                    throw new Error('認証方法が選択されていません');
                }
                
            } catch (error) {
                console.error('Gemini API エラー:', error);
                
                // APIキーが無効な場合は削除
                if (error.message.includes('API') || error.message.includes('401') || error.message.includes('403')) {

                    updateAuthStatus('error', 'APIキーが無効です。再設定してください。');

                return generateSampleErDiagram();
            }
        }

        function prepareDbStructureForAI(database) {
            const structure = {
                name: database.name,
                description: database.description,
                tables: {}
            };
            
            Object.keys(database.tables).forEach(tableName => {
                const table = database.tables[tableName];
                structure.tables[tableName] = {
                    name: table.name,
                    columns: table.columns,
                    sampleData: table.data.slice(0, 2) // 最初の2行のみ
                };
            });
            
            return JSON.stringify(structure, null, 2);
        }
