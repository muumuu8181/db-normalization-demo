<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loadDatabase関数検証</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .log { background-color: #f8f9fa; padding: 10px; border-radius: 4px; font-family: monospace; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
        button { background-color: #e74c3c; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #c0392b; }
        label { display: block; margin: 10px 0; }
        select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; width: 100%; max-width: 400px; }
    </style>
</head>
<body>
    <h1>loadDatabase関数の動作検証</h1>
    
    <div class="section">
        <h2>動作ログ</h2>
        <div id="log" class="log">検証開始...
</div>
        <button onclick="clearLog()" style="background-color: #666; margin-top: 10px;">ログクリア</button>
    </div>
    
    <div class="section">
        <h2>データベース選択</h2>
        <label>
            <input type="radio" name="database" value="retail" checked onchange="log('データベース選択変更: retail')">
            小売業データベース
        </label>
        <label>
            <input type="radio" name="database" value="finance" onchange="log('データベース選択変更: finance')">
            金融業データベース
        </label>
        <label>
            <input type="radio" name="database" value="realestate" onchange="log('データベース選択変更: realestate')">
            不動産業データベース
        </label>
    </div>
    
    <div class="section">
        <button onclick="loadDatabase()">データベースを読み込み</button>
    </div>
    
    <div class="section">
        <h2>テーブル選択</h2>
        <select id="tableName" onchange="log('テーブル選択変更: ' + this.value)">
            <option value="">テーブルを選択してください</option>
        </select>
    </div>
    
    <div class="section" id="validationResults">
        <h2>検証結果</h2>
        <div id="results"></div>
    </div>

    <script>
        // テスト用データベース
        const databases = {
            retail: {
                name: "小売業データベース",
                description: "EC・店舗販売のための顧客・商品・注文管理システム",
                tables: {
                    customers: {
                        name: "customers (顧客)",
                        columns: ["customer_id", "name", "email", "phone", "address"],
                        data: [
                            [1, "田中太郎", "tanaka@email.com", "090-1234-5678", "東京都渋谷区"],
                            [2, "佐藤花子", "sato@email.com", "090-2345-6789", "大阪府大阪市"],
                            [3, "山田次郎", "yamada@email.com", "090-3456-7890", "愛知県名古屋市"]
                        ]
                    },
                    products: {
                        name: "products (商品)",
                        columns: ["product_id", "name", "category", "price"],
                        data: [
                            [101, "ノートPC", "電子機器", 98000],
                            [102, "マウス", "周辺機器", 2000],
                            [103, "キーボード", "周辺機器", 5000]
                        ]
                    }
                }
            },
            finance: {
                name: "金融業データベース",
                description: "銀行・投資管理システム",
                tables: {
                    accounts: {
                        name: "accounts (口座)",
                        columns: ["account_id", "account_type", "balance"],
                        data: [
                            ["A001", "普通預金", 100000],
                            ["A002", "定期預金", 500000]
                        ]
                    },
                    transactions: {
                        name: "transactions (取引)",
                        columns: ["transaction_id", "account_id", "amount", "type"],
                        data: [
                            ["T001", "A001", 10000, "入金"],
                            ["T002", "A001", -5000, "出金"]
                        ]
                    }
                }
            },
            realestate: {
                name: "不動産業データベース",
                description: "不動産取引管理システム",
                tables: {
                    properties: {
                        name: "properties (物件)",
                        columns: ["property_id", "type", "price", "location"],
                        data: [
                            ["P001", "マンション", 3000000, "東京都"],
                            ["P002", "一戸建て", 4500000, "神奈川県"]
                        ]
                    }
                }
            }
        };

        // ログ機能
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.textContent += `[${timestamp}] ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').textContent = '検証開始...\n';
        }

        // メインのloadDatabase関数（元のコードと同じ）
        function loadDatabase() {
            log('=== loadDatabase関数開始 ===');
            
            try {
                // 1. データベース選択の確認
                const selectedDBElement = document.querySelector('input[name="database"]:checked');
                if (!selectedDBElement) {
                    log('エラー: データベースが選択されていません');
                    updateResults('失敗', 'データベースが選択されていません');
                    return;
                }
                
                const selectedDB = selectedDBElement.value;
                log(`選択されたデータベース: ${selectedDB}`);
                
                // 2. データベースオブジェクトの存在確認
                if (!databases[selectedDB]) {
                    log(`エラー: データベース '${selectedDB}' が見つかりません`);
                    updateResults('失敗', `データベース '${selectedDB}' が見つかりません`);
                    return;
                }
                
                log(`データベース情報: ${databases[selectedDB].name}`);
                log(`テーブル数: ${Object.keys(databases[selectedDB].tables).length}`);
                
                // 3. テーブル名のドロップダウンを更新
                log('updateTableDropdown関数を呼び出し');
                updateTableDropdown(selectedDB);
                
                log('=== loadDatabase関数完了 ===');
                updateResults('成功', `データベース '${selectedDB}' が正常に読み込まれました`);
                
            } catch (error) {
                log(`エラー: ${error.message}`);
                updateResults('失敗', error.message);
            }
        }

        function updateTableDropdown(selectedDB) {
            log('=== updateTableDropdown関数開始 ===');
            
            try {
                // 1. DOM要素の取得
                const tableSelect = document.getElementById('tableName');
                if (!tableSelect) {
                    log('エラー: tableNameセレクト要素が見つかりません');
                    return;
                }
                
                const database = databases[selectedDB];
                log(`対象データベース: ${database.name}`);
                
                // 2. ドロップダウンをクリア
                tableSelect.innerHTML = '';
                log('ドロップダウンをクリア');
                
                // 3. デフォルトオプション
                const defaultOption = document.createElement('option');
                defaultOption.value = '';
                defaultOption.textContent = 'テーブルを選択してください';
                tableSelect.appendChild(defaultOption);
                log('デフォルトオプションを追加');
                
                // 4. 選択されたデータベースのテーブル一覧を追加
                let tableCount = 0;
                Object.keys(database.tables).forEach(tableKey => {
                    const table = database.tables[tableKey];
                    const option = document.createElement('option');
                    option.value = tableKey;
                    option.textContent = `${tableKey} (${table.name}) - ${table.data.length}件`;
                    tableSelect.appendChild(option);
                    log(`テーブルオプション追加: ${tableKey} (${table.data.length}件)`);
                    tableCount++;
                });
                
                log(`=== updateTableDropdown関数完了 (${tableCount}テーブル) ===`);
                
            } catch (error) {
                log(`updateTableDropdownエラー: ${error.message}`);
            }
        }

        function updateResults(status, message) {
            const resultsDiv = document.getElementById('results');
            const statusColor = status === '成功' ? '#27ae60' : '#e74c3c';
            resultsDiv.innerHTML = `
                <div style="padding: 10px; border-radius: 4px; background-color: ${statusColor}20; border: 1px solid ${statusColor};">
                    <strong style="color: ${statusColor};">${status}</strong>: ${message}
                </div>
            `;
        }

        // 初期化時にログ出力
        window.addEventListener('load', function() {
            log('ページ読み込み完了');
            log(`データベースオブジェクト確認: ${Object.keys(databases).join(', ')}`);
            
            // DOM要素の存在確認
            const dbRadios = document.querySelectorAll('input[name="database"]');
            const tableSelect = document.getElementById('tableName');
            
            log(`データベース選択ラジオボタン: ${dbRadios.length}個`);
            log(`テーブル選択セレクト: ${tableSelect ? '存在' : '存在しない'}`);
        });
    </script>
</body>
</html>
